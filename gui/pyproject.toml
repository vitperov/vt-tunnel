[project]
name = "vt-tunnel-gui"
version = "0.1.0"
description = "GUI manager for vt-tunnel settings"
requires-python = ">=3.11"

[dependency-groups]
dev = ["PyQt6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vt_tunnel_gui"]
